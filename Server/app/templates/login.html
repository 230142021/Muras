{% extends "base.html" %}
{% block title %}Вход · MURAS{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Вход для учителя</h1>
  <p class="muted">Следите за прогрессом учеников в игре MURAS: слова, задания, активность.</p>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="u">Логин</label><input id="u" name="username" autocomplete="username" required>
    <label for="p">Пароль</label><input id="p" name="password" type="password" autocomplete="current-password" required>
    <button type="submit">Войти</button>
  </form>
  <p class="muted small">Нет учётной записи? <a href="{{ url_for('dashboard.register') }}">Регистрация по коду приглашения</a></p>
</section>
{% endblock %}
