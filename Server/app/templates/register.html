{% extends "base.html" %}
{% block title %}Регистрация учителя · MURAS{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Регистрация учителя</h1>
  {% if error %}<p class="error" role="alert">{{ error }}</p>{% endif %}
  <form method="post">
    <input type="hidden" name="csrf" value="{{ csrf_token() }}">
    <label for="n">Имя (видят ученики)</label><input id="n" name="display_name" maxlength="48" required>
    <label for="u">Логин</label><input id="u" name="username" autocomplete="username" required>
    <label for="p">Пароль (не короче 8 символов)</label><input id="p" name="password" type="password" autocomplete="new-password" minlength="8" required>
    <label for="i">Код приглашения</label><input id="i" name="invite" required>
    <button type="submit">Создать учётную запись</button>
  </form>
  <p class="muted small"><a href="{{ url_for('dashboard.login') }}">← Уже есть учётная запись</a></p>
</section>
{% endblock %}
