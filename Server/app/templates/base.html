<!doctype html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}MURAS · Мугалим{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('dashboard.static', filename='style.css') }}">
</head>
<body>
<header class="top">
  <a class="brand" href="{{ url_for('dashboard.home') }}"><span class="mark">М</span> MURAS <small>панель учителя</small></a>
  {% if teacher %}
  <nav>
    <span class="who">{{ teacher.display_name }}</span>
    <form method="post" action="{{ url_for('dashboard.logout') }}">
      <input type="hidden" name="csrf" value="{{ csrf_token() }}">
      <button class="link" type="submit">Выйти</button>
    </form>
  </nav>
  {% endif %}
</header>
<main>{% block body %}{% endblock %}</main>
<footer>MURAS — обучающая игра о кыргызском языке и культуре · Ala-Too International University</footer>
</body>
</html>
