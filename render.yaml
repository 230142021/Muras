# One-click deploy on Render (https://render.com): New > Blueprint > select this repository.
services:
  - type: web
    name: muras-api
    runtime: python
    rootDir: Server
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 2 --threads 4 --access-logfile - wsgi:app
    healthCheckPath: /health
    envVars:
      - key: MURAS_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: SECRET_KEY
        generateValue: true
      - key: TEACHER_INVITE_CODE
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: muras-db
          property: connectionString
databases:
  - name: muras-db
    databaseName: muras
    plan: free
